[project]
name = "mcp-host-chatbot"
version = "0.1.0"
description = "Terminal MCP host chatbot with a hand-written JSON-RPC/MCP implementation"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "mcp-server-git>=2025.7.1,<2027",
    "rich>=13.0",
    "starlette>=0.38",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
